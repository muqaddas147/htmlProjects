<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <h1>Student Registration Form</h1>
    <p>Kindly fill your details carefully here </p>
    <form>
        <label>
            Full Name : 
            <input type="text" name="Full Name" id="001" required>
        </label>
        <hr>
                <label>
            Email : 
            <input type="email" name="Email" id="002" required>
        </label>
          <hr>
                <label>
            Phone Number : 
            <input type="tel" name="Phone Number" id="009">
        </label>
         <hr>
                <label>
            Password : 
            <input type="Password" name="Password" id="003">
        </label>
         <hr>
            <label>
             Roll Number : 
            <input type="text" name="Roll Number" id="004">
        </label>
         <hr>
                <label>
            Date Of Birth : 
            <input type="date" name="Date Of Birth" id="005">
        </label>
        <hr>
        <section>
            <h4>Select Your Gender</h4>
            <input type="radio" name="Gender" id="006">Male
            <br>
             <input type="radio" name="Gender" id="007">Female
        </section>
        <hr>
        <h4>Select Your Department</h4>
<select>
    <option>Computer System Engineering</option>
      <option>Computer Science Engineering</option>
        <option>Software Engineering</option>
          <option>Electrical Engineering</option>
</select>
<hr>
    <h4>Select Your City</h4>
    <select>
        <option>Poonch</option>
        <option>Muzaffarabad</option>
        <option>Mirpur</option>
    </select>
<hr>
<label>
    Adress:
<textarea name="Adress" id="008" rows="4" placeholder="Enter Your Adress "></textarea>
</label>
<hr>
<button>
   <input type="submit" value="Register">
</button>
<button>
<input type="reset" value="Clear Form">
</button>
    </form>
</body>
</html>
